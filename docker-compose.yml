services:
  hermes:
    image: hermes-agent:lluminet-v2026.8.27
    container_name: hermes-agent
    restart: unless-stopped
    # 192.168.80.1 MUST be first. It is the only resolver holding the
    # split-horizon *.data-thread.com records (kokoro/metube/etc -> 10.77.10.2);
    # 192.168.0.1 and Tailscale MagicDNS both answer NXDOMAIN for them. NXDOMAIN
    # is an authoritative answer, so the resolver stops there and never consults
    # the later servers — the fallbacks below cannot rescue a wrong first entry.
    # Symptom when this is wrong: TTS dies with "Name or service not known" and
    # chat shows only "model provider failed", because tts.openai.base_url is
    # https://kokoro.data-thread.com/v1 (self-hosted Kokoro, not OpenAI).
    # Verified 2026-08-15: 192.168.80.1 also resolves public names, so it is a
    # complete resolver and the entries after it are pure failure fallbacks.
    # Note the host cannot be used as-is here: its /etc/resolv.conf is the
    # systemd-resolved stub 127.0.0.53, which is meaningless in a container netns.
    dns:
    - 192.168.80.1
    - 192.168.0.1
    - 100.100.100.100
    - 1.1.1.1
    - 8.8.8.8
    user: root
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - /opt/ai/hermes-data:/opt/data
    - /opt/ai/hermes-workspace:/workspace
    runtime: nvidia
    environment:
    - HERMES_UID=1000
    - HERMES_GID=1000
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    # The image ships HERMES_WRITE_SAFE_ROOT=/opt/data, and dotenv does NOT
    # override an already-set process env — so the value in hermes-data/.env
    # was silently ignored. Pinned here so the effective sandbox is explicit.
    # /workspace is the terminal cwd; /tmp/hermes_voice is where the gateway
    # writes auto-TTS replies (without it, every voice reply failed the
    # is_write_denied check).
    - HERMES_WRITE_SAFE_ROOT=/opt/data:/workspace:/tmp/hermes_voice
    - HERMES_VISION_WORKERS=2
    - HERMES_STREAM_READ_TIMEOUT=180
    - HERMES_API_TIMEOUT=300
    command:
    - gateway
    ports:
    - 127.0.0.1:8642:8642
